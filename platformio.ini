; Current board: original ESP32 with a CP2102. For the ESP32-S3, use
; board = esp32-s3-devkitc-1.
[platformio]
default_envs = esp32dev

; Main firmware: src/main.cpp
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_src_filter = +<*> -<ram_capture.cpp> -<dma_test.cpp>

; Test firmware: src/ram_capture.cpp
[env:capture]
extends = env:esp32dev
build_src_filter = +<ram_capture.cpp>

; Test firmware: src/dma_test.cpp (ADC1 continuous mode). Pick the pin with
; PLATFORMIO_BUILD_FLAGS=-DADC_PIN=36 pio run -e dma -t upload
[env:dma]
extends = env:esp32dev
build_src_filter = +<dma_test.cpp>
