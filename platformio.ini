; Board: original ESP32 DevKit with a CP2102.
[platformio]
default_envs = esp32dev

; Main firmware: src/main.cpp
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_src_filter = +<*> -<dma_test.cpp> -<probe.cpp>

; Test firmware: src/dma_test.cpp (ADC1 continuous mode). Pick the pin with
; PLATFORMIO_BUILD_FLAGS=-DADC_PIN=36 pio run -e dma -t upload
[env:dma]
extends = env:esp32dev
build_src_filter = +<dma_test.cpp>

; Test firmware: src/probe.cpp (the ESP32 as a DC voltmeter on GPIO32 and 33).
; Read it with: pio device monitor -b 115200
[env:probe]
extends = env:esp32dev
build_src_filter = +<probe.cpp>
